<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de confirmaciones — Alondra & Julio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>

<div class="admin-login" id="login-view">
  <h2>Panel privado</h2>
  <p class="eyebrow">Solo para los novios</p>
  <form class="rsvp-form" id="login-form">
    <div>
      <label for="email">Correo</label>
      <input type="email" id="email" name="email" required autocomplete="username">
    </div>
    <div>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn">Ingresar</button>
    <p class="form-status" id="login-status"></p>
  </form>
</div>

<div class="admin-shell" id="panel-view" style="display:none;">
  <div class="admin-header">
    <div>
      <h2>Confirmaciones</h2>
      <p class="admin-stats" id="stats"></p>
    </div>
    <button class="btn-link" id="logout-btn">Cerrar sesión</button>
  </div>

  <div class="table-wrap">
    <table class="rsvp-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Invitado</th>
          <th>Adultos</th>
          <th>Niños</th>
          <th>Asistentes</th>
          <th>Mensaje</th>
          <th>Mesa</th>
        </tr>
      </thead>
      <tbody id="rsvp-tbody">
      </tbody>
    </table>
  </div>
</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
